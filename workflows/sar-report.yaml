# =============================================================================
# Workflow: Suspicious Activity Report (SAR) Generator
# Category: security/financial-investigation
#
# Generates a FinCEN-aligned Suspicious Activity Report from seized data
# source evidence. Uses ONLY ES|QL queries -- every field comes from actual
# indexed data with no hallucination risk.
#
# Uses full-text MATCH on text_content to find entity mentions (person names,
# company names, etc.) since these are NOT pre-extracted as keyword fields.
# Email addresses and financial refs ARE available as keyword fields.
#
# Uses elasticsearch.request to POST ES|QL queries to /_query so that
# Liquid template variables are interpolated in the request body.
#
# Author: Forensic Triage Tool
# =============================================================================
version: "1"
name: Suspicious Activity Report Generator
description: >
  Generate a FinCEN-aligned Suspicious Activity Report for a target entity
  (person or company) by querying all indexed evidence via full-text search.
  Every field is populated directly from Elasticsearch data.
enabled: true

tags:
  - financial-investigation
  - sar
  - forensic-triage

# ---------------------------------------------------------------------------
# INPUTS
# ---------------------------------------------------------------------------
inputs:
  - name: entity_name
    type: string
    description: >
      The name of the person or company to generate the SAR for.
      Uses full-text MATCH against text_content to find all documents
      mentioning this entity by any name fragment or alias.
    required: true

# ---------------------------------------------------------------------------
# TRIGGERS
# ---------------------------------------------------------------------------
triggers:
  - type: manual

# ---------------------------------------------------------------------------
# STEPS
# ---------------------------------------------------------------------------
steps:

  # === DATA QUERIES =========================================================

  - name: search_all_docs
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: 'FROM triage-file-metadata | WHERE MATCH(text_content, "{{ inputs.entity_name }}") | KEEP file_path, file_name, file_extension, text_preview, email_from, email_to, email_subject, entities_email, entities_financial_ref | LIMIT 500'

  - name: search_transactions
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: 'FROM triage-file-metadata | WHERE MATCH(text_content, "{{ inputs.entity_name }}") AND (file_extension == ".csv" OR file_extension == ".txt") | KEEP file_path, file_name, text_preview, entities_financial_ref | LIMIT 200'

  - name: search_communications
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: 'FROM triage-file-metadata | WHERE MATCH(text_content, "{{ inputs.entity_name }}") AND (file_extension == ".eml" OR file_extension == ".json") | KEEP file_path, file_name, email_from, email_to, email_subject, text_preview, entities_email | LIMIT 200'

  - name: search_financial_refs
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: 'FROM triage-file-metadata | WHERE entities_financial_ref IS NOT NULL AND MATCH(text_content, "{{ inputs.entity_name }}") | KEEP file_path, file_name, entities_financial_ref | LIMIT 500'

  - name: count_totals
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: 'FROM triage-file-metadata | WHERE MATCH(text_content, "{{ inputs.entity_name }}") | STATS total_docs = COUNT(*), financial_docs = SUM(CASE(file_extension == ".csv" OR file_extension == ".txt", 1, 0)), communications = SUM(CASE(file_extension == ".eml" OR file_extension == ".json", 1, 0)), with_fin_refs = SUM(CASE(entities_financial_ref IS NOT NULL, 1, 0))'

  # === RENDER FULL REPORT (single step so tool invocation returns it all) ====

  - name: render_report
    type: console
    with:
      message: |
        =====================================================================
        SUSPICIOUS ACTIVITY REPORT (SAR)
        FinCEN Form 111
        =====================================================================
        Generated: {{ "now" | date: "%Y-%m-%d %H:%M:%S UTC" }}

        PART I -- SUBJECT INFORMATION
        -----------------------------
        Subject Name:            {{ inputs.entity_name }}
        Total Documents:         {{ steps.count_totals.output.values[0][0] }}
        Financial Documents:     {{ steps.count_totals.output.values[0][1] }}
        Communications:          {{ steps.count_totals.output.values[0][2] }}
        With Financial Refs:     {{ steps.count_totals.output.values[0][3] }}

        PART II -- FINANCIAL REFERENCES & TRANSACTIONS
        -----------------------------------------------
        A. Documents with Financial Identifiers ({{ steps.search_financial_refs.output.values.size }}):
        {% for row in steps.search_financial_refs.output.values %}
          * {{ row[1] }}  ({{ row[0] }})  refs={{ row[2] }}
        {% endfor %}

        B. Financial Documents ({{ steps.search_transactions.output.values.size }}):
        {% for row in steps.search_transactions.output.values %}
          * {{ row[1] }}  ({{ row[0] }})  refs={{ row[3] }}  preview={{ row[2] | truncate: 120 }}
        {% endfor %}

        PART III -- COMMUNICATIONS ({{ steps.search_communications.output.values.size }})
        --------------------------------------------------
        {% for row in steps.search_communications.output.values %}
          * {{ row[1] }}  from={{ row[2] }}  to={{ row[3] }}  subject={{ row[4] }}  preview={{ row[5] | truncate: 120 }}
        {% endfor %}

        PART IV -- SUPPORTING DOCUMENTATION INDEX
        ------------------------------------------
        All files referencing subject ({{ steps.search_all_docs.output.values.size }}):
        {% for row in steps.search_all_docs.output.values %}
          [{{ row[2] }}] {{ row[0] }}  emails={{ row[7] }}  fin_refs={{ row[8] }}
        {% endfor %}

        =====================================================================
        END OF REPORT
        =====================================================================

